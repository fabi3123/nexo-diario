<header class="site-header">
  <div class="container">
    <a routerLink="/" class="brand" aria-label="Nexo Diario, inicio" (click)="cerrarMenu()">
      <span class="brand-logo">N</span>
      <span>Nexo Diario</span>
    </a>

    <button
      type="button"
      class="nav-toggle"
      [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
      [attr.aria-expanded]="menuAbierto()"
      (click)="alternarMenu()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <nav class="site-nav" aria-label="Principal" [class.is-open]="menuAbierto()">
      <ul>
        @for (enlace of enlaces; track enlace.ruta) {
          <li>
            <a
              [routerLink]="enlace.ruta"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: enlace.exacto }"
              (click)="cerrarMenu()"
            >
              {{ enlace.texto }}
              @if (enlace.ruta === '/favoritos' && favoritos.total() > 0) {
                <span class="nav-badge" [attr.aria-label]="favoritos.total() + ' guardados'">
                  {{ favoritos.total() }}
                </span>
              }
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
